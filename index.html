<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f14" />
  <title>Anime Fusion</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="homeBtn" class="icon-btn hidden" aria-label="Home">←</button>
      <div class="brand">
        <div class="brand-dot"></div>
        <span>ANIME FUSION</span>
      </div>
      <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙</button>
    </header>

    <main id="screen"></main>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-nav="home">
        <span class="nav-icon">◆</span>
        <span data-i18n="home">Home</span>
      </button>
      <button class="nav-btn" data-nav="packs">
        <span class="nav-icon">▦</span>
        <span data-i18n="packs">Packs</span>
      </button>
      <button class="nav-btn" data-nav="history">
        <span class="nav-icon">◷</span>
        <span data-i18n="history">History</span>
      </button>
    </nav>
  </div>

  <input id="imagePicker" type="file" accept="image/*" multiple hidden />
  <input id="packImporter" type="file" accept=".fusionpack,.json,application/json" hidden />

  <div id="modalRoot"></div>
  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
